# Lokale Entwicklungsdatenbank, passend zu DATABASE_URL aus .env.example
services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: pluginsync
      MYSQL_USER: pluginsync
      MYSQL_PASSWORD: passwort
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql

volumes:
  mysql-data:
